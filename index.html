<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbie Wordle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">
    <h1 class="title">Wordle</h1>

    <div id="langToggle" class="lang-toggle" role="group" aria-label="Language"></div>

    <div id="board" class="board" aria-label="Game board"></div>

    <div id="keyboard" class="keyboard"></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <button id="endButton" class="end-button" type="button"></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
